<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- White Background -->
  <rect width="512" height="512" fill="#FFFFFF" rx="0" />

  <!-- Sookmyung Navy Outlined Speech Bubble (Rounded Square) -->
  <path d="M 140 56 
           L 372 56 
           A 76 76 0 0 1 448 132 
           L 448 316 
           A 76 76 0 0 1 372 392 
           L 220 392 
           L 130 464 
           L 148 392 
           L 140 392 
           A 76 76 0 0 1 64 316 
           L 64 132 
           A 76 76 0 0 1 140 56 Z" 
        fill="#FFFFFF" 
        stroke="#002B66" 
        stroke-width="24" 
        stroke-linejoin="round" 
        stroke-linecap="round" />

  <!-- Ultra-clean Navy Line Snowflake (Perfect Golden-Ratio Midpoint Branching) -->
  <g transform="translate(256, 224)" stroke="#002B66" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Core Joint -->
    <circle cx="0" cy="0" r="10" fill="#002B66" stroke="none" />

    <!-- 1. Axis 0 deg (Top) - Exact Golden Midpoint: y=-59 -->
    <g>
      <!-- Main Stem -->
      <line x1="0" y1="0" x2="0" y2="-114" />
      <!-- Branch starting at exact midpoint (y=-59) -->
      <line x1="0" y1="-59" x2="-33" y2="-94" stroke-width="20" />
      <line x1="0" y1="-59" x2="33" y2="-94" stroke-width="20" />
    </g>

    <!-- 2. Axis 60 deg -->
    <g transform="rotate(60)">
      <line x1="0" y1="0" x2="0" y2="-114" />
      <line x1="0" y1="-59" x2="-33" y2="-94" stroke-width="20" />
      <line x1="0" y1="-59" x2="33" y2="-94" stroke-width="20" />
    </g>

    <!-- 3. Axis 120 deg -->
    <g transform="rotate(120)">
      <line x1="0" y1="0" x2="0" y2="-114" />
      <line x1="0" y1="-59" x2="-33" y2="-94" stroke-width="20" />
      <line x1="0" y1="-59" x2="33" y2="-94" stroke-width="20" />
    </g>

    <!-- 4. Axis 180 deg -->
    <g transform="rotate(180)">
      <line x1="0" y1="0" x2="0" y2="-114" />
      <line x1="0" y1="-59" x2="-33" y2="-94" stroke-width="20" />
      <line x1="0" y1="-59" x2="33" y2="-94" stroke-width="20" />
    </g>

    <!-- 5. Axis 240 deg -->
    <g transform="rotate(240)">
      <line x1="0" y1="0" x2="0" y2="-114" />
      <line x1="0" y1="-59" x2="-33" y2="-94" stroke-width="20" />
      <line x1="0" y1="-59" x2="33" y2="-94" stroke-width="20" />
    </g>

    <!-- 6. Axis 300 deg -->
    <g transform="rotate(300)">
      <line x1="0" y1="0" x2="0" y2="-114" />
      <line x1="0" y1="-59" x2="-33" y2="-94" stroke-width="20" />
      <line x1="0" y1="-59" x2="33" y2="-94" stroke-width="20" />
    </g>
  </g>
</svg>
